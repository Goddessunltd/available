<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"/><title>Generate Icon</title></head>
<body style="background:#1c1c1a;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:sans-serif;color:#e4e0d8;gap:20px">

<canvas id="c" width="180" height="180" style="border-radius:40px;display:block"></canvas>
<button id="dl" style="background:rgba(201,169,110,0.1);border:1px solid #7a6240;color:#c9a96e;font-size:14px;padding:12px 28px;border-radius:6px;cursor:pointer;letter-spacing:1px">
  Download apple-touch-icon.png
</button>
<p style="font-size:12px;color:#6a6762;text-align:center;max-width:320px">
  Click Download, save the file as <strong style="color:#c9a96e">apple-touch-icon.png</strong>, then upload it to your GitHub repo alongside the other files.
</p>

<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');
const s = 180;

// Background
ctx.fillStyle = '#1c1c1a';
roundRect(ctx, 0, 0, s, s, 40);
ctx.fill();

// Inner card
ctx.fillStyle = '#232320';
roundRect(ctx, 12, 12, s-24, s-24, 24);
ctx.fill();

// Gold letter A
ctx.fillStyle = '#c9a96e';
ctx.font = 'italic 78px Georgia, serif';
ctx.textAlign = 'center';
ctx.textBaseline = 'middle';
ctx.fillText('A', s/2, s/2 + 6);

// Bottom rule
ctx.fillStyle = '#7a6240';
ctx.globalAlpha = 0.7;
ctx.fillRect(28, 138, s-56, 2);
ctx.globalAlpha = 1;

document.getElementById('dl').onclick = () => {
  const a = document.createElement('a');
  a.download = 'apple-touch-icon.png';
  a.href = c.toDataURL('image/png');
  a.click();
};

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}
</script>
</body>
</html>
